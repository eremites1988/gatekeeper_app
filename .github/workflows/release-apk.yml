name: Release APK

# Builds a release APK and signs it when a version tag (vX.Y.Z) is pushed,
# then publishes a GitHub Release with the APK attached. Signing runs only
# when the keystore secrets are configured; otherwise an unsigned APK is
# produced and the workflow says so.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-sign:
    name: Build & sign release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::warning::Signing secrets not configured — publishing an UNSIGNED APK."
            OUT="app/build/outputs/apk/release/gatekeeper-${{ steps.version.outputs.tag }}-unsigned.apk"
            cp "$UNSIGNED" "$OUT"
            echo "apk=$OUT" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          ALIAS="${KEY_ALIAS:-gatekeeper}"
          KEY_PW="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          OUT="app/build/outputs/apk/release/gatekeeper-${{ steps.version.outputs.tag }}.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PW" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$OUT" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-release-apk
          path: ${{ steps.sign.outputs.apk }}
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Gatekeeper ${{ steps.version.outputs.tag }}
          files: ${{ steps.sign.outputs.apk }}
          body: |
            Gatekeeper ${{ steps.version.outputs.tag }}

            Signed: ${{ steps.sign.outputs.signed }}

            Install the attached APK on Android 8.0+ (min SDK 26). If unsigned,
            sign it before distribution (see .github/workflows/README.md).
